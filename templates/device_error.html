<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Access Error</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #ff4444;
            --secondary-color: #00ff88;
            --bg-dark: #0a0e27;
            --bg-darker: #050812;
            --border-color: #1a2f5a;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
        }

        body {
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-darker) 100%);
            color: var(--text-primary);
            font-family: 'Roboto', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .error-container {
            background: rgba(10, 14, 39, 0.95);
            border: 2px solid var(--primary-color);
            border-radius: 12px;
            padding: 40px;
            max-width: 500px;
            text-align: center;
        }

        .error-icon {
            font-size: 4rem;
            color: var(--primary-color);
            margin-bottom: 20px;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            color: var(--primary-color);
            margin-bottom: 15px;
            font-size: 1.8rem;
        }

        p {
            color: var(--text-secondary);
            margin-bottom: 10px;
            line-height: 1.6;
        }

        .error-message {
            background: rgba(255, 68, 68, 0.1);
            border: 1px solid var(--primary-color);
            border-radius: 6px;
            padding: 15px;
            margin: 20px 0;
            font-family: 'Orbitron', sans-serif;
            color: var(--primary-color);
        }

        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: rgba(0, 255, 136, 0.2);
            border: 2px solid var(--secondary-color);
            color: var(--secondary-color);
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            font-family: 'Roboto', sans-serif;
            font-size: 1rem;
            margin-top: 20px;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: rgba(0, 255, 136, 0.3);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">
            <i class="fas fa-link-slash"></i>
        </div>
        <h1>Access Denied</h1>
        <p>The device link you're trying to access is <strong>invalid</strong> or <strong>expired</strong>.</p>
        <div class="error-message">
            {{ message }}
        </div>
        <p>Device links expire after 1 hour of generation. Please request a new link from the main dashboard.</p>
        <a href="/" class="btn">
            <i class="fas fa-home"></i> Return to Dashboard
        </a>
    </div>
</body>
</html>
